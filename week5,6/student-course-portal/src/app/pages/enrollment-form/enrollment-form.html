<h2>Student Enrollment Request</h2>

<form #enrollForm="ngForm"
      (ngSubmit)="onSubmit(enrollForm)">

    <p>
        <label>Name</label><br>

        <input
            type="text"
            name="studentName"
            required
            minlength="3"
            [(ngModel)]="studentName"
            #nameCtrl="ngModel">

        <br>

        <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
            Name is required
        </span>

        <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
            Name must be at least 3 characters
        </span>
    </p>

    <p>
        <label>Email</label><br>

        <input
            type="email"
            name="studentEmail"
            required
            email
            [(ngModel)]="studentEmail"
            #emailCtrl="ngModel">

        <br>

        <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
            Email is required
        </span>

        <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
            Invalid Email
        </span>
    </p>

    <p>
        <label>Course ID</label><br>

        <input
            type="number"
            name="courseId"
            required
            [(ngModel)]="courseId"
            #courseCtrl="ngModel">

        <br>

        <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
            Course ID is required
        </span>
    </p>

    <p>
        <label>Preferred Semester</label><br>

        <select
            name="preferredSemester"
            [(ngModel)]="preferredSemester">

            <option value="">Select</option>
            <option>Odd</option>
            <option>Even</option>

        </select>
    </p>

    <p>
        <label>
            <input
                type="checkbox"
                name="agreeToTerms"
                required
                [(ngModel)]="agreeToTerms"
                #termsCtrl="ngModel">

            I Agree to Terms
        </label>

        <br>

        <span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
            Please accept the terms.
        </span>
    </p>

    <button
        type="submit"
        [disabled]="enrollForm.invalid">
        Submit
    </button>

    <button
        type="button"
        (click)="enrollForm.resetForm()">
        Reset
    </button>

</form>

<div *ngIf="submitted">
    <h3 style="color:green">
        Enrollment request submitted successfully!
    </h3>
</div>
